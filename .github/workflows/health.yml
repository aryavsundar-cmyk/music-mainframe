# Watches the deployed service: answers, news cache fresh, last fetch clean.
# Deterministic and cheap — a scheduled HTTP check, not an agent. On failure it opens (or updates) one issue.
name: health

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the live service
        id: check
        run: node scripts/check-health.mjs --url "${MM_URL:-https://music-mainframe.onrender.com}" --max-age 45 --retries 4 2>&1 | tee health.txt
        env:
          MM_URL: ${{ vars.MM_URL }}
      - name: Open or update an issue when the check fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const body = `The scheduled health check failed.\n\n\`\`\`\n${fs.existsSync('health.txt') ? fs.readFileSync('health.txt', 'utf8') : 'no output captured'}\n\`\`\`\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const title = 'Health check failing'
            const { data: open } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'health' })
            if (open.length) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, body })
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['health'] })
            }
